  <title>Everblue</title>
  <meta name="description" content="A marca Everblue em movimento: o globo segue o cursor e o gradiente responde ao gesto.">
  <meta name="theme-color" content="#1226C8">
  <link rel="stylesheet" href="landing.css">
  <script src="globe-core.js" defer></script>
  <script src="gradient.js" defer></script>
  <script src="landing.js" defer></script>
</head>

<body>

  <!-- o gradiente ocupa a tela inteira; o véu é o clarão baixo que segura o
     contraste do lockup sem obrigar o fundo a clarear no meio -->
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="veu" aria-hidden="true"></div>

  <div class="pagina">
    <header class="topo">
      <a class="selo" href="#" aria-label="Everblue">
        <svg viewBox="0 0 843 150" fill="currentColor" aria-hidden="true">
          <use href="#letra" />
        </svg>
      </a>
      <nav>
        <a href="#">Marca</a>
        <a href="#">Sistema</a>
        <a href="#">Estúdio</a>
        <a href="#">Contato</a>
      </nav>
    </header>

    <main class="heroi">
      <div class="lockup" id="lockup">
        <!-- o globo é desenhado pelo mesmo motor do gerador da marca: um <svg> vazio
           que o JS preenche com os caminhos da geometria, quadro a quadro -->
        <svg id="globo" viewBox="-230 -230 460 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Everblue"></svg>
        <svg class="logotipo" id="logotipo" viewBox="0 0 843 150" fill="currentColor" aria-hidden="true">
          <use href="#letra" />
        </svg>
      </div>
    </main>

    <!-- Leitura ao vivo da esfera: os cinco valores saem da pose em vigor, não
         de um relógio à parte, então param quando o globo para. Cada um é um
         botão — clicar acende no globo o lugar de onde o número sai. -->
    <footer class="rodape" id="rodape" aria-label="Leitura da esfera">
      <button class="leit" type="button" data-ind="lat" aria-pressed="false"><i>lat</i><b id="vLat">—</b></button>
      <button class="leit" type="button" data-ind="lon" aria-pressed="false"><i>lon</i><b id="vLon">—</b></button>
      <button class="leit" type="button" data-ind="az" aria-pressed="false"><i>azimute</i><b id="vAz">—</b></button>
      <button class="leit" type="button" data-ind="des" aria-pressed="false"><i>desvio</i><b id="vDes">—</b></button>
      <button class="leit" type="button" data-ind="vel" aria-pressed="false"><i>giro</i><b id="vVel">—</b></button>
    </footer>
  </div>

  <!-- painel de controle: flutua sobre a página e arrasta pela barra de título -->
  <aside class="hud" id="hud" aria-label="Controles da cena">
    <div class="hud-top" id="hudTop">
      <span class="hud-titulo">Controles</span>
      <span class="hud-fps" id="hudFps">—</span>
      <button class="icone" id="hudMin" type="button" aria-expanded="true" aria-label="Minimizar painel" title="Minimizar (M)">–</button>
      <button class="icone" id="hudFechar" type="button" aria-label="Esconder painel" title="Esconder (H)">×</button>
    </div>

    <div class="hud-body" id="hudBody"><!-- montado por landing.js --></div>

    <div class="hud-pe">
      <button class="pe-btn" id="hudCopiar" type="button">Copiar estado</button>
      <button class="pe-btn" id="hudReset" type="button">Restaurar</button>
      <span class="hud-nota" id="hudNota" role="status" aria-live="polite"></span>
    </div>
  </aside>

  <button id="hudAbrir" type="button" aria-label="Mostrar controles" title="Mostrar controles (H)">⚙</button>

</body>

</html>
